name: Bell
options:
  bundleIdPrefix: com.bellcare
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ''
targets:
  Bell:
    type: application
    platform: iOS
    sources:
      - path: Bell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bellcare.app
        INFOPLIST_FILE: Bell/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - BellTests
  BellTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BellTests
    dependencies:
      - target: Bell
